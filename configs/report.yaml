# 분포 리포트의 '부족' 판정 기준 (근거: 평가 지표가 흔들리지 않을 최소 표본)
targets:
  train_per_class: 500     # 클래스당 학습 객체 수 목표
  val_per_class: 100       # 클래스당 검증 객체 수 목표 (100 미만이면 recall 1개 차이가 1%p 이상)
  cell_train: 30           # 조건(날씨×시간) × 클래스 칸의 최소 학습 객체 수
  cell_val: 10             # 같은 칸의 최소 검증 객체 수
  test_per_class: 100      # 평가 전용 맵(test) 클래스당 객체 수 목표
  cell_test: 10
  heldout_maps: 1          # 학습에 쓰지 않은 평가 전용 맵 수
small_tl_px: 16            # 이보다 낮은 신호등 박스는 '작음' (YOLO 640 입력이면 절반 이하로 줄어듦)
