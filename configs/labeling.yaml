# 자동 라벨링 규칙 (원본 data/raw → 라벨 data/processed)
# 규칙을 바꾸면 재수집 없이 20_autolabel.py만 다시 실행하면 된다
version: 4   # v2: max_facing_angle 60 → 70 (각도별 실측 근거)
             # v3: 차량을 세그 인스턴스 기준으로 (주차 차량·자차 옆 차량 포함, 자차 보닛 제외)
             # v4: 기준 미달이지만 보이는 물체를 무시 영역(ignores)으로 출력 → 내보낼 때 회색으로 가림

classes: [vehicle, tl_red, tl_yellow, tl_green]

vehicle:
  min_visible_px: 150      # 보이는 픽셀 수 (인스턴스 세그에서 이 차량 ID인 픽셀)
  min_box_height: 12       # px
  max_distance: 80.0       # m
  ignore_min_px: 20        # 라벨 기준 미달이어도 이만큼 보이면 무시 영역

traffic_light:
  min_visible_px: 20       # 헤드 박스 안에서 이 신호등 ID인 픽셀 수
  min_visible_ratio: 0.3   # 보이는 픽셀 / 투영 박스 면적 (가림 판정)
  min_box_height: 8        # px
  # deg, 헤드 정면(+y축)과 카메라 방향 사이 각. 넘으면 색이 안 보이는 것으로 보고 제외
  # v1 데이터 실측 (불빛 색이 보이는 비율): ≤60° 78~100%, 60~70° 71%, 70~80° 21%, ≥80° 0%
  max_facing_angle: 70.0
  max_distance: 80.0       # m
  ignore_min_px: 5         # 라벨 기준 미달이어도 이만큼 보이면 무시 영역
