# 중복 제거 규칙: 아래를 모두 만족하면 '마지막으로 남긴 프레임'의 중복으로 본다
# v1 실측 (연속 프레임 dHash 해밍 거리): 정지 중 중앙값 0 / 90% 2, 주행 중 중앙값 9 (단 17%는 ≤4)
# → 해시만 쓰면 주행 프레임도 지워지므로 자차 이동 거리와 라벨 구성을 함께 본다
version: 1
max_move_m: 0.5           # 대표 프레임 이후 자차 이동 거리
max_hamming: 4            # dHash 해밍 거리 (64bit)
require_same_labels: true # 클래스별 객체 수가 같아야 함 (신호 변화·차량 출입 시 남김)
max_gap_s: 10.0           # 중복이어도 대표 프레임 이후 이 시간이 지나면 새 대표로 남김
