# C-2 녹화: 보행자 시나리오 클립 (scripts/53_ped_scenarios.py --record) → outputs/compare/ped_clips/clips
# 시나리오 정의는 src/driveloop/eval/scenarios.py (PED_SCENARIOS: cross / stop / dartout / sidewalk / curb)
