name: ped_clips              # 녹화 전용 (--record), 지표는 ped_scen_v1
map: Town05
conditions:
  - [clear, noon]
conditions_source: configs/collection/v3.yaml
scenarios: [cross, stop, dartout]
seeds: [1]
seconds: 30
perceptions: [gt]
walker_blueprint: walker.pedestrian.0001
output_root: outputs/compare
