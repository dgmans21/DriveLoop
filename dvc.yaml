# 데이터 파이프라인
#   원본(data/raw/<v>, dvc add) → 라벨 → 메타데이터·QC → 중복 제거   (원본 버전마다 반복: foreach)
#   → 데이터셋 내보내기(여러 원본을 합칠 수 있음) → 분포 리포트
# 규칙·코드를 바꾸면 `dvc repro`가 영향받는 단계만 다시 실행하고 결과 해시를 dvc.lock에 기록한다.
# 실행 전 conda activate driveloop (cmd의 python이 이 환경을 가리켜야 함)
stages:
  autolabel:
    foreach: [v1, v2, v3]
    do:
      cmd: python scripts/20_autolabel.py --dataset ${item}
      deps:
        - data/raw/${item}
        - scripts/20_autolabel.py
        - src/driveloop/data/autolabel.py
        - src/driveloop/data/geometry.py
        - configs/labeling.yaml
      outs:
        - data/processed/${item}/labels

  metadata:
    foreach: [v1, v2, v3]
    do:
      cmd: python scripts/22_build_metadata.py --dataset ${item}
      deps:
        - data/raw/${item}
        - data/processed/${item}/labels
        - scripts/22_build_metadata.py
        - src/driveloop/data/metadata.py
        - configs/qc.yaml
      outs:
        - data/processed/${item}/frames.parquet
        - data/processed/${item}/objects.parquet
      metrics:
        - data/processed/${item}/qc_report.json:
            cache: false

  dedup:
    foreach: [v1, v2, v3]
    do:
      cmd: python scripts/23_dedup.py --dataset ${item} --samples 0
      deps:
        - data/processed/${item}/frames.parquet
        - scripts/23_dedup.py
        - src/driveloop/data/dedup.py
        - configs/dedup.yaml
      outs:
        - data/processed/${item}/dedup.parquet
      metrics:
        - data/processed/${item}/dedup_report.json:
            cache: false

  # 데이터셋 v1 = 원본 v1 (비교 기준으로 유지)
  export_v1:
    cmd: python scripts/24_export_yolo.py --config configs/export/v1.yaml
    deps:
      - data/raw/v1
      - data/processed/v1/labels
      - data/processed/v1/frames.parquet
      - data/processed/v1/objects.parquet
      - data/processed/v1/dedup.parquet
      - scripts/24_export_yolo.py
      - src/driveloop/data/export.py
      - configs/export/v1.yaml
    outs:
      - data/datasets/v1

  # 데이터셋 v2 = 원본 v1 + v2, Town05는 test
  export_v2:
    cmd: python scripts/24_export_yolo.py --config configs/export/v2.yaml
    deps:
      - data/raw/v1
      - data/raw/v2
      - data/processed/v1/labels
      - data/processed/v1/frames.parquet
      - data/processed/v1/objects.parquet
      - data/processed/v1/dedup.parquet
      - data/processed/v2/labels
      - data/processed/v2/frames.parquet
      - data/processed/v2/objects.parquet
      - data/processed/v2/dedup.parquet
      - scripts/24_export_yolo.py
      - src/driveloop/data/export.py
      - configs/export/v2.yaml
    outs:
      - data/datasets/v2

  # 데이터셋 v3 = 원본 v1 + v2 + v3 (Town02·04 추가), test는 v2와 같은 Town05
  export_v3:
    cmd: python scripts/24_export_yolo.py --config configs/export/v3.yaml
    deps:
      - data/raw/v1
      - data/raw/v2
      - data/raw/v3
      - data/processed/v1/labels
      - data/processed/v1/frames.parquet
      - data/processed/v1/objects.parquet
      - data/processed/v1/dedup.parquet
      - data/processed/v2/labels
      - data/processed/v2/frames.parquet
      - data/processed/v2/objects.parquet
      - data/processed/v2/dedup.parquet
      - data/processed/v3/labels
      - data/processed/v3/frames.parquet
      - data/processed/v3/objects.parquet
      - data/processed/v3/dedup.parquet
      - scripts/24_export_yolo.py
      - src/driveloop/data/export.py
      - configs/export/v3.yaml
    outs:
      - data/datasets/v3

  report:
    foreach: [v1, v2, v3]
    do:
      cmd: python scripts/25_distribution_report.py --dataset ${item} --config configs/report.yaml
      deps:
        - data/datasets/${item}
        - scripts/25_distribution_report.py
        - configs/report.yaml
      outs:
        - data/reports/${item}/distribution.html
      metrics:
        - data/reports/${item}/distribution_report.json:
            cache: false
